# gen_imports.py (runtime/tools): the modules whose imports the table serves.
# libmonobdwgc-2.0.so has the SONAME libmonoboehm-2.0.so (libmono-native.so
# lists that name as DT_NEEDED); libunity loads it by dlopen, not DT_NEEDED.
MODULES libmain.so libunity.so libmonobdwgc-2.0.so libmono-native.so libMonoPosixHelper.so
# ABI-compatible libm/ctype/stdlib leftovers (no struct, fd or off_t crosses them)
PASSTHROUGH abs acosh acoshf asinh asinhf atanh atanhf cbrt cbrtf coshf fma fmaf hypot ilogb ilogbf ldexpf log2 log2f nearbyintf scalbn scalbnf sinhf tanhf isascii isdigit iswlower strtoimax lldiv
# bionic's sys_signame[] table (cw_bionic_extra.c)
DATA sys_signame b_sys_signame
